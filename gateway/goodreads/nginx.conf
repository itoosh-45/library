# Included by Nginx Proxy Manager at server scope. No change to the n8n root route.
location ^~ /library-catalog/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $library_backend http://library-goodreads:4333;
    rewrite ^/library-catalog/(.*)$ /$1 break;
    proxy_pass $library_backend;
    proxy_set_header Host library-goodreads;
    proxy_set_header Connection "";
    proxy_set_header Upgrade "";
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
    client_max_body_size 1k;
    access_log off;
}
