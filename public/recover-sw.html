<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>תיקון הספרייה</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111}
    main{max-width:34rem;padding:2rem;line-height:1.55}
    h1{font-size:1.35rem;margin:0 0 .75rem}
    p{margin:.5rem 0}
    button{font:inherit;padding:.7rem 1rem;border:1px solid #bbb;border-radius:.7rem;background:#f5f5f5}
    #status{margin-top:1rem;color:#444}
  </style>
</head>
<body>
<main>
  <h1>מתקן את גרסת האפליקציה המקומית…</h1>
  <p>הפעולה מסירה רק Service Worker וקבצי cache של האפליקציה.</p>
  <p><strong>הספרים, המדפים, ההשאלות, הדירוגים ושאר נתוני הספרייה לא נמחקים.</strong></p>
  <p id="status" role="status">מתחיל…</p>
  <button id="retry" hidden type="button">נסה שוב</button>
</main>
<script>
(() => {
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');

  async function recover() {
    retry.hidden = true;
    status.textContent = 'מסיר גרסת Service Worker ישנה…';
    try {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations
          .filter(reg => {
            const scope = new URL(reg.scope);
            return scope.origin === location.origin && scope.pathname.startsWith('/library/');
          })
          .map(reg => reg.unregister()));
      }

      status.textContent = 'מנקה רק את cache של קבצי האפליקציה…';
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names
          .filter(name => name.startsWith('itoosh-library-shell-') || name.startsWith('itoosh-library-path-shell-'))
          .map(name => caches.delete(name)));
      }

      status.textContent = 'הושלם. פותח את הספרייה מחדש…';
      location.replace('/library/?sw-recovery=' + Date.now());
    } catch (error) {
      console.error(error);
      status.textContent = 'התיקון האוטומטי נכשל. לחץ על נסה שוב.';
      retry.hidden = false;
    }
  }

  retry.addEventListener('click', recover);
  void recover();
})();
</script>
</body>
</html>
